[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# `tests/` se añade a sys.path para que conftest sea importable desde los
# módulos de prueba (las constantes compartidas viven ahí).
pythonpath = . tests

addopts =
    --strict-markers
    --tb=short
    -ra

filterwarnings =
    ignore::DeprecationWarning:sqlalchemy.*
    ignore::UserWarning:flask_limiter.*
