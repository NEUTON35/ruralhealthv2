{% extends 'base.html' %}
{% block content %}
<div class="max-w-3xl mx-auto">
    <section class="bg-white border border-linea rounded-lg p-6">
        <div class="mb-6">
            <p class="text-xs font-semibold uppercase tracking-widest text-emerald-600">RuralHealth para instituciones</p>
            <h1 class="text-2xl font-semibold text-slate-900 mt-1">Sea socio</h1>
            <p class="text-slate-500 mt-2">Dejenos sus datos y nos comunicaremos con usted para activar su clínica en el sistema.</p>
        </div>

        <form method="POST" class="grid sm:grid-cols-2 gap-3">
            <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
            <input name="nombre" required placeholder="Nombre completo" class="{{ CAMPO }}" aria-label="Nombre completo">
            <input name="institucion" placeholder="Institución" class="{{ CAMPO }}" aria-label="Institución">
            <input name="telefono" placeholder="Teléfono" class="{{ CAMPO }}" aria-label="Teléfono">
            <input name="email" type="email" placeholder="Email" class="{{ CAMPO }}" aria-label="Email">
            <input name="ciudad" placeholder="Ciudad" class="{{ CAMPO }}" aria-label="Ciudad">
            <textarea name="mensaje" rows="5" placeholder="Mensaje o necesidades de la institución" class="{{ CAMPO }}" aria-label="Mensaje o necesidades de la institución"></textarea>
            <button class="{{ BOTON }}">
                <i data-lucide="send" class="w-5 h-5"></i>
                Enviar solicitud
            </button>
        </form>
    </section>
</div>
{% endblock %}
