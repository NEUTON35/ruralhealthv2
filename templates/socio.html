{% extends 'base.html' %}
{% block content %}
<div class="max-w-3xl mx-auto">
    <section class="bg-white border border-slate-100 rounded-lg shadow-sm p-6">
        <div class="mb-6">
            <p class="text-xs font-black uppercase tracking-widest text-emerald-600">RuralHealth para instituciones</p>
            <h1 class="text-3xl font-black text-slate-900 mt-1">Se socio</h1>
            <p class="text-slate-500 mt-2">Dejanos tus datos y te contactaremos para activar tu clinica en el sistema.</p>
        </div>

        <form method="POST" class="grid sm:grid-cols-2 gap-3">
            <input name="nombre" required placeholder="Nombre completo" class="border p-3 rounded-lg">
            <input name="institucion" placeholder="Institucion" class="border p-3 rounded-lg">
            <input name="telefono" placeholder="Telefono" class="border p-3 rounded-lg">
            <input name="email" type="email" placeholder="Email" class="border p-3 rounded-lg">
            <input name="ciudad" placeholder="Ciudad" class="border p-3 rounded-lg sm:col-span-2">
            <textarea name="mensaje" rows="5" placeholder="Mensaje o necesidades de la institucion" class="border p-3 rounded-lg sm:col-span-2"></textarea>
            <button class="bg-emerald-600 text-white px-4 py-3 rounded-lg font-black sm:col-span-2 inline-flex items-center justify-center gap-2">
                <i data-lucide="send" class="w-5 h-5"></i>
                Enviar solicitud
            </button>
        </form>
    </section>
</div>
{% endblock %}
