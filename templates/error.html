{% extends "base.html" %}

{% block content %}
<div class="min-h-[70vh] flex items-center justify-center px-4">
    <div class="max-w-md w-full text-center">
        <div class="mb-8 flex justify-center">
            <div class="p-4 bg-red-50 rounded-full">
                <i data-lucide="alert-triangle" class="w-16 h-16 text-red-500"></i>
            </div>
        </div>
        
        <h1 class="text-4xl font-bold text-gray-900 mb-4">{{ title or "Algo salió mal" }}</h1>
        <p class="text-lg text-gray-600 mb-8">
            {{ message or "Ha ocurrido un error inesperado en nuestro sistema." }}
        </p>
        
        <div class="space-y-4">
            <a href="{{ url_for('index') }}" 
               class="inline-flex items-center justify-center w-full px-6 py-3 border border-transparent text-base font-medium rounded-xl text-white bg-blue-600 hover:bg-blue-700 transition-all shadow-lg hover:shadow-xl">
                <i data-lucide="home" class="w-5 h-5 mr-2"></i>
                Volver al inicio
            </a>
            
            <p class="text-sm text-gray-400">
                Código de error: <span class="font-mono">{{ code or 500 }}</span>
            </p>
        </div>
    </div>
</div>
{% endblock %}
